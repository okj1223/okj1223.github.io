<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Notion Printer processing flow</title>
  <desc id="desc">A left-to-right flow from Notion HTML or ZIP export through input preparation, print conversion, output variants, preview editing, and print or PDF output.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#14746f"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#162033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#14746f"/>
    </marker>
  </defs>
  <rect width="1180" height="520" rx="28" fill="#f6f8fb"/>
  <path d="M40 82 H1140" stroke="#d8e2ee" stroke-width="1"/>
  <text x="54" y="54" fill="#162033" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800">Notion Printer pipeline</text>
  <text x="54" y="84" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="15">Exported Notion documents are normalized into print-first HTML with preview-time controls.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="142" width="160" height="220" rx="18" fill="url(#panel)" stroke="#d6dfeb"/>
    <rect x="78" y="176" width="108" height="132" rx="8" fill="#ffffff" stroke="#c7d3e2"/>
    <path d="M94 202 H168 M94 226 H168 M94 250 H150 M94 276 H162" stroke="#98a7b9" stroke-width="9" stroke-linecap="round"/>
    <circle cx="154" cy="286" r="19" fill="#eaf7f2" stroke="#14746f"/>
    <path d="M145 287 L153 295 L166 279" fill="none" stroke="#14746f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="336" text-anchor="middle" fill="#162033" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Notion export</text>
    <text x="132" y="358" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">HTML or ZIP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="276" y="142" width="160" height="220" rx="18" fill="url(#panel)" stroke="#d6dfeb"/>
    <path d="M320 206 h72 v22 h-72z M304 242 h104 v22 H304z M324 278 h64 v22 h-64z" fill="#dff3ee" stroke="#14746f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M304 192 h104" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
    <text x="356" y="336" text-anchor="middle" fill="#162033" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Input prep</text>
    <text x="356" y="358" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">extract, validate, order</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="142" width="180" height="220" rx="18" fill="url(#panel)" stroke="#d6dfeb"/>
    <path d="M556 190 h68 a20 20 0 0 1 20 20 v68 a20 20 0 0 1-20 20 h-68 a20 20 0 0 1-20-20 v-68 a20 20 0 0 1 20-20z" fill="#162033"/>
    <path d="M560 236 h60 M560 258 h44 M560 214 h48" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.86"/>
    <circle cx="628" cy="280" r="22" fill="#14746f"/>
    <path d="M619 280 h18 M628 271 v18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="590" y="336" text-anchor="middle" fill="#162033" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Print converter</text>
    <text x="590" y="358" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">structure, CSS, assets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="744" y="142" width="168" height="220" rx="18" fill="url(#panel)" stroke="#d6dfeb"/>
    <rect x="780" y="190" width="96" height="34" rx="8" fill="#e8f0ff" stroke="#2563eb"/>
    <rect x="780" y="238" width="96" height="34" rx="8" fill="#eaf7f2" stroke="#14746f"/>
    <rect x="780" y="286" width="96" height="34" rx="8" fill="#fff7e5" stroke="#c98512"/>
    <text x="828" y="212" text-anchor="middle" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">print</text>
    <text x="828" y="260" text-anchor="middle" fill="#14746f" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">compact</text>
    <text x="828" y="308" text-anchor="middle" fill="#9a6a13" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">fast</text>
    <text x="828" y="336" text-anchor="middle" fill="#162033" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Variants</text>
    <text x="828" y="358" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">print-ready HTML</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="976" y="142" width="152" height="220" rx="18" fill="url(#panel)" stroke="#d6dfeb"/>
    <rect x="1006" y="178" width="92" height="112" rx="4" fill="#ffffff" stroke="#c7d3e2"/>
    <path d="M1020 206 h64 M1020 228 h42 M1020 250 h56" stroke="#98a7b9" stroke-width="7" stroke-linecap="round"/>
    <path d="M1006 308 h92" stroke="#14746f" stroke-width="8" stroke-linecap="round"/>
    <text x="1052" y="336" text-anchor="middle" fill="#162033" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">Preview &amp; print</text>
    <text x="1052" y="358" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">adjust, save PDF</text>
  </g>

  <path d="M224 252 H260" stroke="url(#accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M448 252 H484" stroke="url(#accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M692 252 H728" stroke="url(#accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M924 252 H960" stroke="url(#accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <g>
    <rect x="118" y="416" width="944" height="52" rx="16" fill="#ffffff" stroke="#d6dfeb"/>
    <text x="140" y="448" fill="#162033" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Design target:</text>
    <text x="248" y="448" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="14">turn screen-first Notion pages into readable, inspectable, repeatable paper output without rebuilding each document by hand.</text>
  </g>
</svg>
