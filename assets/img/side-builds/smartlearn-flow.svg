<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Smart Learn study system flow</title>
  <desc id="desc">A diagram showing structured TSV decks flowing through a local Python server, Smart queue scheduler, browser and phone PWA controls, English TTS, offline review queue, and SQLite progress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f4f8ed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2d7ff9"/>
      <stop offset="1" stop-color="#8bbf3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#243447" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#405869"/>
    </marker>
  </defs>

  <rect width="1280" height="620" rx="34" fill="url(#bg)"/>
  <rect x="54" y="50" width="1172" height="520" rx="28" fill="#ffffff" stroke="#dce7ef" stroke-width="2" filter="url(#shadow)"/>
  <path d="M92 118 H1188" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

  <text x="92" y="96" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#172b3a">Smart Learn</text>
  <text x="270" y="96" font-family="Inter, Arial, sans-serif" font-size="18" fill="#60727f">multi-deck study player</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(96 160)">
      <rect width="170" height="122" rx="18" fill="#eef5ff" stroke="#bed4fb" stroke-width="2"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#17324d">Deck Files</text>
      <text x="22" y="64" font-size="13" fill="#587083">structured TSV</text>
      <text x="22" y="84" font-size="13" fill="#587083">folders and sets</text>
      <text x="22" y="104" font-size="13" fill="#587083">language overlays</text>
    </g>

    <g transform="translate(326 160)">
      <rect width="176" height="122" rx="18" fill="#f6f8fb" stroke="#d5e1ea" stroke-width="2"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#17324d">Python Server</text>
      <text x="22" y="64" font-size="13" fill="#587083">deck loader</text>
      <text x="22" y="84" font-size="13" fill="#587083">sync API</text>
      <text x="22" y="104" font-size="13" fill="#587083">Tailscale URL</text>
    </g>

    <g transform="translate(562 160)">
      <rect width="176" height="122" rx="18" fill="#f7fbf2" stroke="#cde3b4" stroke-width="2"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#17324d">Smart Queue</text>
      <text x="22" y="64" font-size="13" fill="#587083">due / weak</text>
      <text x="22" y="84" font-size="13" fill="#587083">recovery</text>
      <text x="22" y="104" font-size="13" fill="#587083">new cards</text>
    </g>

    <g transform="translate(798 160)">
      <rect width="176" height="122" rx="18" fill="#fff8ed" stroke="#f1d9ac" stroke-width="2"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#17324d">Study UI</text>
      <text x="22" y="64" font-size="13" fill="#587083">desktop</text>
      <text x="22" y="84" font-size="13" fill="#587083">mini window</text>
      <text x="22" y="104" font-size="13" fill="#587083">phone PWA</text>
    </g>

    <g transform="translate(1034 160)">
      <rect width="150" height="122" rx="18" fill="#f4f1ff" stroke="#d8cdf8" stroke-width="2"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#17324d">Controls</text>
      <text x="22" y="64" font-size="13" fill="#587083">keys</text>
      <text x="22" y="84" font-size="13" fill="#587083">swipes</text>
      <text x="22" y="104" font-size="13" fill="#587083">TTS</text>
    </g>

    <path d="M266 221 H316" stroke="#405869" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M502 221 H552" stroke="#405869" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M738 221 H788" stroke="#405869" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M974 221 H1024" stroke="#405869" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(168 380)">
      <rect width="220" height="104" rx="18" fill="#ffffff" stroke="#dce7ef" stroke-width="2"/>
      <text x="24" y="36" font-size="17" font-weight="700" fill="#17324d">Review Event</text>
      <text x="24" y="63" font-size="13" fill="#587083">Still Learning</text>
      <text x="24" y="83" font-size="13" fill="#587083">Knew It</text>
    </g>

    <g transform="translate(530 380)">
      <rect width="220" height="104" rx="18" fill="#ffffff" stroke="#dce7ef" stroke-width="2"/>
      <text x="24" y="36" font-size="17" font-weight="700" fill="#17324d">Offline Queue</text>
      <text x="24" y="63" font-size="13" fill="#587083">IndexedDB</text>
      <text x="24" y="83" font-size="13" fill="#587083">pending reviews</text>
    </g>

    <g transform="translate(892 380)">
      <rect width="220" height="104" rx="18" fill="#ffffff" stroke="#dce7ef" stroke-width="2"/>
      <text x="24" y="36" font-size="17" font-weight="700" fill="#17324d">SQLite Progress</text>
      <text x="24" y="63" font-size="13" fill="#587083">review log</text>
      <text x="24" y="83" font-size="13" fill="#587083">card scheduling</text>
    </g>

    <path d="M1109 282 C1108 330 312 324 278 372" fill="none" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M388 432 H520" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M750 432 H882" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1002 380 C1004 332 666 326 650 292" fill="none" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="386" y="512" width="508" height="42" rx="21" fill="#17324d"/>
    <text x="640" y="539" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">hands-light review, durable progress, phone-ready study</text>
  </g>
</svg>
