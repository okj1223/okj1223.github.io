<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Weaveflow long-running AI work control flow</title>
  <desc id="desc">A diagram showing OpenClaw or Discord requests flowing through Weaveflow job intake, runtime preflight, policy gates, Codex work segments, checkpoints, reports, and recovery review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef7f3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2d7ff9"/>
      <stop offset="1" stop-color="#16a085"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#153145" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a5668"/>
    </marker>
  </defs>

  <rect width="1280" height="620" rx="34" fill="url(#bg)"/>
  <rect x="54" y="50" width="1172" height="520" rx="28" fill="#ffffff" stroke="#d9e7ef" stroke-width="2" filter="url(#shadow)"/>
  <path d="M92 118 H1188" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>

  <text x="92" y="96" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#172b3a">Weaveflow</text>
  <text x="246" y="96" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5b6f7d">recoverable long-running AI work</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(92 164)">
      <rect width="160" height="116" rx="18" fill="#eef5ff" stroke="#bed4fb" stroke-width="2"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#17324d">Remote</text>
      <text x="22" y="64" font-size="18" font-weight="700" fill="#17324d">Operator</text>
      <text x="22" y="91" font-size="13" fill="#577088">OpenClaw / Discord</text>
    </g>

    <g transform="translate(310 164)">
      <rect width="174" height="116" rx="18" fill="#f6f8fb" stroke="#d5e1ea" stroke-width="2"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#17324d">Job Intake</text>
      <text x="22" y="64" font-size="13" fill="#577088">request scope</text>
      <text x="22" y="84" font-size="13" fill="#577088">run profile</text>
      <text x="22" y="104" font-size="13" fill="#577088">target workspace</text>
    </g>

    <g transform="translate(542 164)">
      <rect width="174" height="116" rx="18" fill="#f7fbf8" stroke="#c7e4d5" stroke-width="2"/>
      <text x="22" y="36" font-size="18" font-weight="700" fill="#17324d">Preflight</text>
      <text x="22" y="62" font-size="13" fill="#577088">runtime import</text>
      <text x="22" y="82" font-size="13" fill="#577088">git state</text>
      <text x="22" y="102" font-size="13" fill="#577088">worker command</text>
    </g>

    <g transform="translate(774 164)">
      <rect width="174" height="116" rx="18" fill="#fff8ed" stroke="#f1d9ac" stroke-width="2"/>
      <text x="22" y="36" font-size="18" font-weight="700" fill="#17324d">Policy Gates</text>
      <text x="22" y="62" font-size="13" fill="#577088">safe worktree</text>
      <text x="22" y="82" font-size="13" fill="#577088">deny risky actions</text>
      <text x="22" y="102" font-size="13" fill="#577088">quality review</text>
    </g>

    <g transform="translate(1006 164)">
      <rect width="174" height="116" rx="18" fill="#f4f1ff" stroke="#d8cdf8" stroke-width="2"/>
      <text x="22" y="36" font-size="18" font-weight="700" fill="#17324d">Codex</text>
      <text x="22" y="62" font-size="18" font-weight="700" fill="#17324d">Segment</text>
      <text x="22" y="89" font-size="13" fill="#577088">bounded worker run</text>
    </g>

    <path d="M252 222 H300" stroke="#3a5668" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M484 222 H532" stroke="#3a5668" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M716 222 H764" stroke="#3a5668" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M948 222 H996" stroke="#3a5668" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(194 370)">
      <rect width="214" height="104" rx="18" fill="#ffffff" stroke="#d9e7ef" stroke-width="2"/>
      <text x="24" y="36" font-size="17" font-weight="700" fill="#17324d">Local Artifacts</text>
      <text x="24" y="63" font-size="13" fill="#577088">.weaveflow/tasks</text>
      <text x="24" y="83" font-size="13" fill="#577088">.weaveflow/jobs</text>
    </g>

    <g transform="translate(486 370)">
      <rect width="214" height="104" rx="18" fill="#ffffff" stroke="#d9e7ef" stroke-width="2"/>
      <text x="24" y="36" font-size="17" font-weight="700" fill="#17324d">Checkpoints</text>
      <text x="24" y="63" font-size="13" fill="#577088">resume capsule</text>
      <text x="24" y="83" font-size="13" fill="#577088">next prompt</text>
    </g>

    <g transform="translate(778 370)">
      <rect width="214" height="104" rx="18" fill="#ffffff" stroke="#d9e7ef" stroke-width="2"/>
      <text x="24" y="36" font-size="17" font-weight="700" fill="#17324d">Korean Report</text>
      <text x="24" y="63" font-size="13" fill="#577088">status</text>
      <text x="24" y="83" font-size="13" fill="#577088">review / recover</text>
    </g>

    <path d="M1093 282 C1093 330 964 326 884 366" fill="none" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M778 422 H710" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M486 422 H418" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M292 370 C218 338 170 318 170 290" fill="none" stroke="#6a7f8f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="382" y="512" width="516" height="42" rx="21" fill="#17324d"/>
    <text x="640" y="539" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">startable, checkable, cancellable, recoverable</text>
  </g>
</svg>
