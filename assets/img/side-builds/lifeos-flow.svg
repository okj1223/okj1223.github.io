<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">LifeOS operating loop</title>
  <desc id="desc">A LifeOS workflow diagram showing quick capture, inbox clarification, structured entities, dashboard execution, structure map inspection, and review feedback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8fb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#122033" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1180" height="560" rx="30" fill="url(#bg)"/>
  <text x="58" y="62" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">LifeOS operating loop</text>
  <text x="58" y="92" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="15">Capture loosely first, clarify later, then inspect relationships so execution stays clear.</text>
  <path d="M58 112 H1122" stroke="#d8e4ef" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="54" y="162" width="156" height="184" rx="18" fill="url(#card)" stroke="#d6e1ec"/>
    <circle cx="132" cy="222" r="43" fill="#e6f4ef" stroke="#0f766e"/>
    <path d="M114 222 h36 M132 204 v36" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
    <text x="132" y="298" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Quick Capture</text>
    <text x="132" y="322" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">throw it in</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="268" y="162" width="156" height="184" rx="18" fill="url(#card)" stroke="#d6e1ec"/>
    <rect x="306" y="190" width="80" height="108" rx="10" fill="#ffffff" stroke="#bfd0df"/>
    <path d="M321 220 h50 M321 244 h42 M321 268 h56" stroke="#9aa8b8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="382" cy="194" r="18" fill="#2563eb"/>
    <text x="382" y="201" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">?</text>
    <text x="346" y="298" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Inbox</text>
    <text x="346" y="322" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">unprocessed inputs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="482" y="162" width="216" height="184" rx="18" fill="url(#card)" stroke="#d6e1ec"/>
    <rect x="516" y="196" width="64" height="34" rx="9" fill="#e8f0ff" stroke="#2563eb"/>
    <rect x="600" y="196" width="64" height="34" rx="9" fill="#e6f4ef" stroke="#0f766e"/>
    <rect x="516" y="248" width="64" height="34" rx="9" fill="#fff6df" stroke="#c98512"/>
    <rect x="600" y="248" width="64" height="34" rx="9" fill="#f1ebff" stroke="#7c3aed"/>
    <text x="548" y="218" text-anchor="middle" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Task</text>
    <text x="632" y="218" text-anchor="middle" fill="#0f766e" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Project</text>
    <text x="548" y="270" text-anchor="middle" fill="#9a6a13" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Goal</text>
    <text x="632" y="270" text-anchor="middle" fill="#6d28d9" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Resource</text>
    <text x="590" y="298" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Clarify &amp; organize</text>
    <text x="590" y="322" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">connect only when useful</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="756" y="162" width="156" height="184" rx="18" fill="url(#card)" stroke="#d6e1ec"/>
    <rect x="790" y="194" width="88" height="86" rx="12" fill="#172033"/>
    <path d="M808 220 h52 M808 244 h34" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.86"/>
    <circle cx="864" cy="268" r="18" fill="#0f766e"/>
    <path d="M856 268 l6 6 12-14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="834" y="298" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Dashboard</text>
    <text x="834" y="322" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">today and next</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="970" y="162" width="156" height="184" rx="18" fill="url(#card)" stroke="#d6e1ec"/>
    <circle cx="1048" cy="222" r="12" fill="#2563eb"/>
    <circle cx="1018" cy="270" r="12" fill="#0f766e"/>
    <circle cx="1078" cy="270" r="12" fill="#c98512"/>
    <path d="M1042 232 L1024 260 M1054 232 L1072 260 M1030 270 H1066" stroke="#718096" stroke-width="5" stroke-linecap="round"/>
    <text x="1048" y="298" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Structure</text>
    <text x="1048" y="322" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">see the shape</text>
  </g>

  <path d="M222 254 H252" stroke="url(#green)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M436 254 H466" stroke="url(#green)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M710 254 H740" stroke="url(#green)" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M924 254 H954" stroke="url(#green)" stroke-width="5" marker-end="url(#arrow)"/>

  <g>
    <path d="M1048 368 C1048 444 132 444 132 368" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 12" marker-end="url(#arrow)"/>
    <rect x="420" y="414" width="340" height="58" rx="18" fill="#ffffff" stroke="#d6e1ec"/>
    <text x="590" y="438" text-anchor="middle" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Review closes the loop</text>
    <text x="590" y="460" text-anchor="middle" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">daily and weekly checks turn drift back into next actions</text>
  </g>

  <g>
    <rect x="112" y="496" width="956" height="38" rx="14" fill="#ffffff" stroke="#d6e1ec"/>
    <text x="136" y="520" fill="#172033" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Product stance:</text>
    <text x="250" y="520" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="13">planning should emerge from captured reality, not from filling every field before work can start.</text>
  </g>
</svg>
